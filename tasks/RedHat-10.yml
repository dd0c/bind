- name: Make sure required packages for bind DNS are present
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Make sure named is enabled and started
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started

